<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="50%" style="stop-color:#150a24"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" fill="url(#bg)" rx="16"/>
  <!-- background circles -->
  <g opacity="0.04">
    <circle cx="80" cy="60" r="90" fill="#8B5CF6"/>
    <circle cx="920" cy="160" r="110" fill="#A78BFA"/>
    <circle cx="500" cy="220" r="130" fill="#6D28D9"/>
    <circle cx="300" cy="180" r="60" fill="#8B5CF6"/>
    <circle cx="750" cy="40" r="50" fill="#A78BFA"/>
  </g>
  <!-- grid lines -->
  <g opacity="0.03" stroke="#8B5CF6" stroke-width="0.5">
    <line x1="0" y1="50" x2="1000" y2="50"/>
    <line x1="0" y1="100" x2="1000" y2="100"/>
    <line x1="0" y1="150" x2="1000" y2="150"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="220"/>
    <line x1="400" y1="0" x2="400" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
    <line x1="800" y1="0" x2="800" y2="220"/>
  </g>
  <!-- accent line -->
  <rect x="0" y="0" width="1000" height="3" fill="url(#line)"/>
  <!-- header -->
  <text x="50" y="75" font-family="'Courier New', monospace" font-size="15" fill="#555">~/developer $</text>
  <text x="190" y="75" font-family="'Courier New', monospace" font-size="15" fill="#8B5CF6">cat profile.json</text>
  <text x="50" y="105" font-family="'Courier New', monospace" font-size="34" font-weight="bold" fill="#8B5CF6">
    { Parth Shinde }
  </text>
  <text x="50" y="135" font-family="'Courier New', monospace" font-size="15" fill="#888">
    "role": "Game Developer / Content Creator",
  </text>
  <text x="50" y="158" font-family="'Courier New', monospace" font-size="15" fill="#888">
    "vibe": "Building cool things with code & creativity"
  </text>
  <g transform="translate(50, 175)">
    <rect x="0" y="0" width="280" height="2" rx="1" fill="url(#accent)"/>
  </g>
  <!-- stats card -->
  <g transform="translate(720, 55)">
    <rect x="0" y="0" width="230" height="120" rx="12" fill="rgba(139,92,246,0.06)" stroke="rgba(139,92,246,0.15)" stroke-width="1"/>
    <text x="115" y="30" font-family="'Courier New', monospace" font-size="9" fill="#666" text-anchor="middle">// STATS</text>
    <text x="20" y="52" font-family="'Courier New', monospace" font-size="10" fill="#555">repos: 15+</text>
    <text x="20" y="70" font-family="'Courier New', monospace" font-size="10" fill="#555">stack: fullstack</text>
    <text x="20" y="88" font-family="'Courier New', monospace" font-size="10" fill="#555">status: building</text>
    <text x="115" y="108" font-family="'Courier New', monospace" font-size="11" fill="#8B5CF6" text-anchor="middle" font-weight="bold">✦ available ✦</text>
  </g>
  <!-- cursor blink -->
  <rect x="650" y="98" width="2" height="30" fill="#8B5CF6" opacity="0.6">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
