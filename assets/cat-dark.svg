<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <circle cx="70" cy="70" r="65" fill="url(#glow)"/>
  <!-- body -->
  <ellipse cx="70" cy="100" rx="40" ry="28" fill="#1a1a2e" stroke="#8B5CF6" stroke-width="2"/>
  <!-- head -->
  <circle cx="70" cy="52" r="32" fill="#1a1a2e" stroke="#8B5CF6" stroke-width="2"/>
  <!-- ears -->
  <polygon points="45,32 35,10 55,26" fill="#1a1a2e" stroke="#8B5CF6" stroke-width="2"/>
  <polygon points="95,32 105,10 85,26" fill="#1a1a2e" stroke="#8B5CF6" stroke-width="2"/>
  <!-- inner ears -->
  <polygon points="47,30 39,15 54,27" fill="#8B5CF6" opacity="0.25"/>
  <polygon points="93,30 101,15 86,27" fill="#8B5CF6" opacity="0.25"/>
  <!-- eyes - big anime style -->
  <ellipse cx="58" cy="50" rx="9" ry="10" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.5"/>
  <ellipse cx="82" cy="50" rx="9" ry="10" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.5"/>
  <!-- irises -->
  <ellipse cx="59" cy="50" rx="6" ry="7" fill="#8B5CF6"/>
  <ellipse cx="83" cy="50" rx="6" ry="7" fill="#8B5CF6"/>
  <!-- pupils -->
  <ellipse cx="60" cy="50" rx="3" ry="5" fill="#0D1117"/>
  <ellipse cx="84" cy="50" rx="3" ry="5" fill="#0D1117"/>
  <!-- eye shine -->
  <circle cx="56" cy="47" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="80" cy="47" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="61" cy="52" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="85" cy="52" r="1" fill="#fff" opacity="0.4"/>
  <!-- nose -->
  <polygon points="70,58 67,61 73,61" fill="#8B5CF6"/>
  <!-- mouth -->
  <path d="M67,63 Q70,66 73,63" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M64,63 Q67,60 70,63" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <path d="M70,63 Q73,60 76,63" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- blush -->
  <ellipse cx="50" cy="57" rx="5" ry="3" fill="#ff6b9d" opacity="0.2"/>
  <ellipse cx="90" cy="57" rx="5" ry="3" fill="#ff6b9d" opacity="0.2"/>
  <!-- whiskers -->
  <line x1="50" y1="58" x2="32" y2="54" stroke="#555" stroke-width="1" stroke-linecap="round"/>
  <line x1="50" y1="61" x2="30" y2="63" stroke="#555" stroke-width="1" stroke-linecap="round"/>
  <line x1="90" y1="58" x2="108" y2="54" stroke="#555" stroke-width="1" stroke-linecap="round"/>
  <line x1="90" y1="61" x2="110" y2="63" stroke="#555" stroke-width="1" stroke-linecap="round"/>
  <!-- paws -->
  <ellipse cx="52" cy="118" rx="10" ry="6" fill="#1a1a2e" stroke="#8B5CF6" stroke-width="2"/>
  <ellipse cx="88" cy="118" rx="10" ry="6" fill="#1a1a2e" stroke="#8B5CF6" stroke-width="2"/>
  <!-- paw pads -->
  <ellipse cx="52" cy="119" rx="4" ry="2.5" fill="#8B5CF6" opacity="0.3"/>
  <ellipse cx="88" cy="119" rx="4" ry="2.5" fill="#8B5CF6" opacity="0.3"/>
  <!-- tail -->
  <path d="M105,100 Q122,88 118,68" fill="none" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M118,68 Q116,60 112,62" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
  <!-- coding glasses -->
  <circle cx="58" cy="50" r="11" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.4"/>
  <circle cx="82" cy="50" r="11" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.4"/>
  <line x1="69" y1="50" x2="71" y2="50" stroke="#8B5CF6" stroke-width="1.5" opacity="0.4"/>
  <line x1="47" y1="50" x2="42" y2="48" stroke="#8B5CF6" stroke-width="1.5" opacity="0.4"/>
  <line x1="93" y1="50" x2="98" y2="48" stroke="#8B5CF6" stroke-width="1.5" opacity="0.4"/>
  <!-- floating hearts -->
  <text x="105" y="38" font-size="8" fill="#ff6b9d" opacity="0.6">❤</text>
  <text x="112" y="45" font-size="6" fill="#ff6b9d" opacity="0.4">❤</text>
  <!-- code brackets -->
  <text x="62" y="75" font-size="7" fill="#8B5CF6" opacity="0.3" font-family="monospace">&lt;/&gt;</text>
</svg>
