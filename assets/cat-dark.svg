<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- body -->
  <ellipse cx="60" cy="85" rx="35" ry="25" fill="#1a1a2e" stroke="#8B5CF6" stroke-width="2"/>
  <!-- head -->
  <circle cx="60" cy="45" r="28" fill="#1a1a2e" stroke="#8B5CF6" stroke-width="2"/>
  <!-- ears -->
  <polygon points="38,28 30,10 48,22" fill="#1a1a2e" stroke="#8B5CF6" stroke-width="2"/>
  <polygon points="82,28 90,10 72,22" fill="#1a1a2e" stroke="#8B5CF6" stroke-width="2"/>
  <!-- inner ears -->
  <polygon points="40,26 34,14 47,23" fill="#8B5CF6" opacity="0.3"/>
  <polygon points="80,26 86,14 73,23" fill="#8B5CF6" opacity="0.3"/>
  <!-- eyes -->
  <ellipse cx="49" cy="43" rx="6" ry="7" fill="#fff"/>
  <ellipse cx="71" cy="43" rx="6" ry="7" fill="#fff"/>
  <!-- pupils -->
  <ellipse cx="50" cy="43" rx="3" ry="5" fill="#8B5CF6"/>
  <ellipse cx="72" cy="43" rx="3" ry="5" fill="#8B5CF6"/>
  <!-- nose -->
  <polygon points="60,50 57,53 63,53" fill="#8B5CF6"/>
  <!-- mouth -->
  <path d="M57,55 Q60,58 63,55" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
  <!-- whiskers -->
  <line x1="45" y1="50" x2="30" y2="47" stroke="#555" stroke-width="1"/>
  <line x1="45" y1="53" x2="28" y2="55" stroke="#555" stroke-width="1"/>
  <line x1="75" y1="50" x2="90" y2="47" stroke="#555" stroke-width="1"/>
  <line x1="75" y1="53" x2="92" y2="55" stroke="#555" stroke-width="1"/>
  <!-- paws -->
  <ellipse cx="45" cy="100" rx="8" ry="5" fill="#1a1a2e" stroke="#8B5CF6" stroke-width="2"/>
  <ellipse cx="75" cy="100" rx="8" ry="5" fill="#1a1a2e" stroke="#8B5CF6" stroke-width="2"/>
  <!-- tail -->
  <path d="M90,85 Q105,75 100,60" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
  <!-- heart -->
  <text x="95" y="55" font-size="10" fill="#ff6b9d">❤</text>
</svg>
